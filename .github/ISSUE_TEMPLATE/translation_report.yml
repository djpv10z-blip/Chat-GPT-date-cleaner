name: "🌐 Translation improvement"
description: "Report a mistranslation or suggest better wording."
title: "[TRANSLATION] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us improve one of the eight interface languages.
        Please quote UI strings only; do not include conversation titles, message content, or authentication details.
  - type: dropdown
    id: language
    attributes:
      label: Language
      options:
        - Italiano (Italian)
        - English
        - Español (Spanish)
        - Русский (Russian)
        - 日本語 (Japanese)
        - 简体中文 (Simplified Chinese)
        - العربية (Arabic)
        - Français (French)
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Where does the text appear?
      placeholder: "e.g. Date picker, Scan results, Confirmation dialog"
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: Current interface text
      description: Copy only the extension's own interface wording.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested translation
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this better? (optional)
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report includes no private conversation content or authentication data.
          required: true
